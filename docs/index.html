<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI News Daily</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg-main: #ffffff;
      --bg-card: #f8f9fa;
      --bg-header: #e9ecef;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #6c757d;
      --accent: #a855f7;
      --link: #0d6efd;
    }
    
    [data-theme="dark"] {
      --bg-main: #0d1117;
      --bg-card: #161b22;
      --bg-header: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: var(--bg-main);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--accent);
    }
    
    h1 { 
      font-size: 2em;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
    }
    .theme-toggle:hover { background: var(--bg-header); }
    
    .date-banner {
      background: linear-gradient(135deg, #faf5ff 0%, #fdf4ff 100%);
      border-left: 4px solid var(--accent);
      padding: 15px 20px;
      margin-bottom: 25px;
      border-radius: 0 8px 8px 0;
    }
    
    [data-theme="dark"] .date-banner {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    
    .date-label {
      color: var(--text-muted);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .date-value {
      font-size: 1.4em;
      font-weight: bold;
      color: var(--accent);
    }
    
    .news-list {
      display: grid;
      gap: 20px;
    }
    
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      transition: box-shadow 0.2s;
    }
    
    .news-card:hover {
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.1);
    }
    
    .news-number {
      display: inline-block;
      background: var(--accent);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      text-align: center;
      line-height: 28px;
      font-weight: bold;
      font-size: 0.85em;
      margin-right: 10px;
    }
    
    .news-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    
    .news-source {
      display: inline-block;
      background: var(--bg-header);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 0.75em;
      font-weight: 500;
    }
    
    .news-topic {
      display: inline-block;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 0.75em;
    }
    
    .news-title {
      font-size: 1.2em;
      line-height: 1.4;
      margin-bottom: 12px;
      color: var(--text);
    }
    
    .news-title a {
      color: inherit;
      text-decoration: none;
    }
    
    .news-title a:hover {
      color: var(--accent);
    }
    
    .news-tldr {
      background: var(--bg-header);
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 0.95em;
      line-height: 1.5;
      color: var(--text);
    }
    
    .news-tldr strong {
      color: var(--accent);
    }
    
    .news-importance {
      padding: 10px 15px;
      margin-bottom: 12px;
      border-left: 3px solid #10b981;
      background: rgba(16, 185, 129, 0.05);
      border-radius: 0 6px 6px 0;
      font-size: 0.9em;
      color: var(--text-muted);
    }
    
    .news-importance strong {
      color: #10b981;
    }
    
    .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85em;
      color: var(--text-muted);
    }
    
    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent);
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85em;
      transition: opacity 0.2s;
    }
    
    .read-more:hover {
      opacity: 0.9;
      color: white;
    }
    
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    
    .archive-section {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid var(--border);
    }
    
    .archive-title {
      font-size: 1.2em;
      margin-bottom: 15px;
      color: var(--text-muted);
    }
    
    .archive-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    
    .archive-link {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85em;
      transition: all 0.2s;
    }
    
    .archive-link:hover {
      background: var(--bg-header);
      color: var(--text);
      text-decoration: none;
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    .footer-links a {
      color: var(--link);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.9em;
    }
    
    .footer-links a:hover {
      background: var(--bg-header);
    }
    
    .footer-text {
      color: var(--text-muted);
      font-size: 0.85em;
    }
    
    @media (max-width: 600px) {
      h1 { font-size: 1.6em; }
      .news-title { font-size: 1.1em; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 AI News Daily</h1>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌓</button>
  </div>
  
  <div class="date-banner">
    <div class="date-label">📰 Top AI Stories for</div>
    <div class="date-value" id="date-value">Loading...</div>
  </div>
  
  <div class="news-list" id="news-list">
    <div style="text-align: center; padding: 30px; color: var(--text-muted);">⏳ Loading...</div>
  </div>
  
  <div class="archive-section" id="archive-section" style="display: none;">
    <div class="archive-title">📅 Past Days</div>
    <div class="archive-list" id="archive-list"></div>
  </div>
  
  <div class="footer">
    <div class="footer-links">
      <a href="https://leetcode.com/u/alexey_wish/">🎯 LeetCode</a>
      <a href="https://github.com/alexeybutyrev/leetcode-solutions">📝 Solutions</a>
      <a href="https://alexeybutyrev.github.io/daily-leetcode/">📅 Daily</a>
      <a href="https://github.com/alexeybutyrev/ai-news">💻 GitHub</a>
    </div>
    <p class="footer-text">
      Curated by AI • Updated daily at 6:00 AM UTC<br>
      Made with ❤️ by Alexey Butyrev
    </p>
  </div>

  <script>
    // Theme - default to light
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
    
    // Load news
    fetch('news.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        document.getElementById('date-value').textContent = data.date || 'Today';
        const container = document.getElementById('news-list');
        
        if (!data.articles || data.articles.length === 0) {
          container.innerHTML = '<div style="text-align: center; padding: 30px; color: var(--text-muted);">No articles found.</div>';
          return;
        }
        
        container.innerHTML = data.articles.map((article, i) => `
          <article class="news-card">
            <div class="news-badges">
              <span class="news-number">${i + 1}</span>
              <span class="news-source">${escapeHtml(article.source)}</span>
              ${article.topic ? `<span class="news-topic">${escapeHtml(article.topic)}</span>` : ''}
            </div>
            <h2 class="news-title">
              <a href="${escapeHtml(article.url)}" target="_blank" rel="noopener">
                ${escapeHtml(article.title)}
              </a>
            </h2>
            <div class="news-tldr">
              <strong>TLDR:</strong> ${escapeHtml(article.tldr)}
            </div>
            <div class="news-importance">
              <strong>Why it matters:</strong> ${escapeHtml(article.importance || 'Relevant for understanding AI industry trends.')}
            </div>
            <div class="news-meta">
              <span>${escapeHtml(article.formatted_date || article.date)}</span>
              <a href="${escapeHtml(article.url)}" target="_blank" rel="noopener" class="read-more">
                Read →
              </a>
            </div>
          </article>
        `).join('');
        
        // Load archive links
        loadArchive();
      })
      .catch(err => {
        document.getElementById('news-list').innerHTML = `
          <div style="text-align: center; padding: 30px; color: var(--text-muted);">
            ⚠️ Could not load news.<br>
            <small>${err.message}</small>
          </div>
        `;
      });
    
    // Load archive
    async function loadArchive() {
      const archiveSection = document.getElementById('archive-section');
      const archiveList = document.getElementById('archive-list');
      
      // Try to load archive files for the last 7 days
      const dates = [];
      const today = new Date();
      
      for (let i = 1; i <= 7; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        dates.push(dateStr);
      }
      
      const links = [];
      
      for (const date of dates) {
        try {
          const r = await fetch(`archive/${date}.json`, { method: 'HEAD' });
          if (r.ok) {
            links.push(date);
          }
        } catch {}
      }
      
      if (links.length > 0) {
        archiveList.innerHTML = links.map(date => {
          const d = new Date(date);
          const formatted = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          return `<a href="archive/${date}.json" class="archive-link" target="_blank">${formatted}</a>`;
        }).join('');
        archiveSection.style.display = 'block';
      }
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
